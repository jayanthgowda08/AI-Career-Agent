services:
  # PostgreSQL with pgvector extension pre-installed
  db:
    image: pgvector/pgvector:pg16
    container_name: career_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_password}
      POSTGRES_DB: ${POSTGRES_DB:-career_agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career_user} -d ${POSTGRES_DB:-career_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - optional visual database browser (access at localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: career_agent_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
